name: StayHub
description: "StayHub — broker-free property rental marketplace for Android."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Navigation
  go_router: ^17.2.1

  # HTTP & networking
  dio: ^5.4.3
  retrofit: ^4.1.0

  # WebSocket (real-time chat)
  web_socket_channel: ^3.0.1

  # Authentication
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^10.0.0

  # Local storage
  shared_preferences: ^2.5.5

  # UI utilities
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.20.2
  timeago: ^3.7.0

  # Image handling
  image_picker: ^1.2.2

  # Utilities
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0
  logger: ^2.4.0
  connectivity_plus: ^7.1.1
  crypto: ^3.0.6

  # Environment variables
  flutter_dotenv: ^6.0.1
  geolocator: ^14.0.1
  geocoding: ^4.0.0
  share_plus: ^12.0.2
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  record: ^7.0.0
  audioplayers: ^6.0.0
  path_provider: ^2.1.3
  emoji_picker_flutter: ^4.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^4.0.3
  retrofit_generator: ^10.2.5
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
    - .env

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/logo.jpeg"
  min_sdk_android: 21
  adaptive_icon_background: "#16A34A"
  adaptive_icon_foreground: "assets/icon/logo.jpeg"
